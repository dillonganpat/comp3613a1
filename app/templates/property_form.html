{% extends "authenticated-base.html" %}
{% block title %}CampusStay | Add property{% endblock %}

{% block subpage_content %}
<div class="container-fluid py-2 dashboard-shell">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="form-panel">
        <p class="eyebrow mb-1">Landlord</p>
        <h1 class="h3 mb-3">List a property</h1>

        <form method="post" action="{{ url_for('property_create_action') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="title">Title</label>
              <input class="form-control" id="title" name="title" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="location">Location</label>
              <input class="form-control" id="location" name="location" placeholder="e.g. 12 Watts Street, St. Augustine" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
            </div>
            <div class="col-12">
              <label class="form-label" for="image_file">Apartment image file</label>
              <input class="form-control" id="image_file" name="image_file" type="file" accept="image/*">
              <input type="hidden" id="image_url" name="image_url" value="">
              <div class="form-text">Upload an image file or leave blank to use the default campus photo.</div>
            </div>

            <script>
              document.getElementById('image_file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                  const reader = new FileReader();
                  reader.onload = function(event) {
                    document.getElementById('image_url').value = event.target.result;
                  };
                  reader.readAsDataURL(file);
                }
              });
            </script>
            <div class="col-md-4">
              <label class="form-label" for="price_per_night">Nightly price</label>
              <input class="form-control" id="price_per_night" name="price_per_night" type="number" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="bedrooms">Bedrooms</label>
              <input class="form-control" id="bedrooms" name="bedrooms" type="number" min="1" value="1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="bathrooms">Bathrooms</label>
              <input class="form-control" id="bathrooms" name="bathrooms" type="number" min="1" value="1" required>
            </div>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a class="btn btn-outline-secondary" href="{{ url_for('admin_home_view') }}">Back</a>
            <button class="btn btn-primary btn-brand" type="submit">Publish listing</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
